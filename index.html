<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAIC - Secure Autonomous Incident Commander</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            height: 90vh;
            max-height: 600px;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 10px 10px 0 0;
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        
        .header p {
            font-size: 12px;
            opacity: 0.9;
        }
        
        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f5f5f5;
        }
        
        .message {
            margin-bottom: 15px;
            padding: 12px;
            border-radius: 8px;
            max-width: 80%;
            word-wrap: break-word;
        }
        
        .user-message {
            background: #667eea;
            color: white;
            margin-left: auto;
            text-align: right;
        }
        
        .bot-message {
            background: white;
            color: #333;
            border: 1px solid #ddd;
            margin-right: auto;
        }
        
        .input-area {
            border-top: 1px solid #ddd;
            padding: 20px;
            display: flex;
            gap: 10px;
            background: white;
            border-radius: 0 0 10px 10px;
        }
        
        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        
        button {
            padding: 12px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        
        button:hover {
            background: #764ba2;
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .loading {
            text-align: center;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚨 SAIC</h1>
            <p>Secure Autonomous Incident Commander</p>
        </div>
        
        <div class="chat-box" id="chatBox">
            <div class="bot-message">
                👋 Hello! I'm SAIC. Report an incident and I'll help diagnose it.
            </div>
        </div>
        
        <div class="input-area">
            <input 
                type="text" 
                id="messageInput" 
                placeholder="Describe your incident (e.g., 'Service checkout latency spiked 400%')"
                onkeypress="if(event.key==='Enter') sendMessage()"
            >
            <button onclick="sendMessage()" id="sendBtn">Send</button>
        </div>
    </div>

    <script>
        const API_URL = "https://saic-agent.onrender.com/api/v1/saic/chat";
        const chatBox = document.getElementById("chatBox");
        const messageInput = document.getElementById("messageInput");
        const sendBtn = document.getElementById("sendBtn");
        let sessionId = "session-" + Date.now();

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;

            // Show user message
            addMessage(message, "user");
            messageInput.value = "";
            sendBtn.disabled = true;

            // Show loading
            const loadingId = "loading-" + Date.now();
            addMessage("⏳ Analyzing incident...", "bot", loadingId);

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: message,
                        session_id: sessionId,
                        user_id: "user",
                        environment: "simulation"
                    })
                });

                const data = await response.json();
                
                // Remove loading message
                const loadingEl = document.getElementById(loadingId);
                if (loadingEl) loadingEl.remove();

                if (response.ok) {
                    const answer = JSON.parse(data.answer);
                    const response_text = `
📊 **Incident Analysis**
Root Cause: ${answer.root_cause}
Status: ${answer.status}
Confidence: ${(answer.confidence * 100).toFixed(0)}%

${answer.final_outcome || ""}

Actions: ${answer.remediation_actions?.join(", ") || "None"}
                    `.trim();
                    
                    addMessage(response_text, "bot");
                } else {
                    addMessage("❌ Error: " + (data.detail || "Unknown error"), "bot");
                }
            } catch (error) {
                const loadingEl = document.getElementById(loadingId);
                if (loadingEl) loadingEl.remove();
                addMessage("❌ Connection error: " + error.message, "bot");
            }

            sendBtn.disabled = false;
            messageInput.focus();
        }

        function addMessage(text, type, elementId = null) {
            const div = document.createElement("div");
            div.className = "message " + (type === "user" ? "user-message" : "bot-message");
            div.textContent = text;
            if (elementId) div.id = elementId;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
