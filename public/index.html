<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAIC - Secure Autonomous Incident Commander</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-1: #eef2ff;
            --bg-2: #f5f3ff;
            --bg-3: #e0e7ff;
            --surface: rgba(255, 255, 255, 0.88);
            --surface-solid: #ffffff;
            --surface-soft: #f8f9ff;
            --text: #172033;
            --text-soft: #64748b;
            --border: rgba(99, 102, 241, 0.15);
            --header-1: #6366f1;
            --header-2: #7c3aed;
            --accent: #6366f1;
            --accent-2: #8b5cf6;
            --shadow: rgba(31, 41, 55, 0.16);
            --bubble-bot: rgba(255, 255, 255, 0.94);
            --input-bg: rgba(248, 250, 252, 0.92);
            --welcome-bg: rgba(99, 102, 241, 0.07);
        }

        body.dark {
            --bg-1: #050816;
            --bg-2: #0b1020;
            --bg-3: #17112c;
            --surface: rgba(13, 18, 35, 0.88);
            --surface-solid: #0d1223;
            --surface-soft: #11182c;
            --text: #f1f5f9;
            --text-soft: #94a3b8;
            --border: rgba(148, 163, 184, 0.14);
            --header-1: #4f46e5;
            --header-2: #7c3aed;
            --accent: #818cf8;
            --accent-2: #a78bfa;
            --shadow: rgba(0, 0, 0, 0.42);
            --bubble-bot: rgba(17, 24, 39, 0.96);
            --input-bg: rgba(15, 23, 42, 0.9);
            --welcome-bg: rgba(129, 140, 248, 0.09);
        }

        html {
            min-height: 100%;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text);
            overflow: hidden;

            background:
                radial-gradient(circle at 15% 20%, rgba(99, 102, 241, 0.24), transparent 28%),
                radial-gradient(circle at 85% 15%, rgba(139, 92, 246, 0.22), transparent 25%),
                radial-gradient(circle at 75% 85%, rgba(59, 130, 246, 0.16), transparent 28%),
                linear-gradient(135deg, var(--bg-1), var(--bg-2), var(--bg-3));
            background-size: 180% 180%;
            animation: backgroundShift 16s ease-in-out infinite;
            transition: background 0.5s ease;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            opacity: 0.45;
            z-index: -1;
            animation: floatOrb 10s ease-in-out infinite alternate;
        }

        body::before {
            top: -80px;
            left: -60px;
            background: rgba(99, 102, 241, 0.28);
        }

        body::after {
            right: -80px;
            bottom: -80px;
            background: rgba(124, 58, 237, 0.25);
            animation-delay: -4s;
        }

        @keyframes backgroundShift {
            0%, 100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        @keyframes floatOrb {
            from {
                transform: translate3d(0, 0, 0) scale(1);
            }
            to {
                transform: translate3d(45px, 30px, 0) scale(1.12);
            }
        }

        /* Mouse glow */
        .mouse-glow {
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            transform: translate(-50%, -50%);
            background: radial-gradient(
                circle,
                rgba(99, 102, 241, 0.16) 0%,
                rgba(139, 92, 246, 0.08) 35%,
                transparent 70%
            );
            filter: blur(8px);
            transition: left 0.08s linear, top 0.08s linear;
        }

        .mouse-dot {
            position: fixed;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 100;
            transform: translate(-50%, -50%);
            background: #818cf8;
            box-shadow:
                0 0 12px rgba(129, 140, 248, 0.8),
                0 0 25px rgba(139, 92, 246, 0.45);
            transition: left 0.04s linear, top 0.04s linear;
        }

        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 920px;
            height: 90vh;
            max-height: 720px;
            display: flex;
            flex-direction: column;
            overflow: hidden;

            background: var(--surface);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);

            border: 1px solid var(--border);
            border-radius: 22px;
            box-shadow:
                0 30px 80px var(--shadow),
                inset 0 1px 0 rgba(255, 255, 255, 0.16);

            animation: slideUp 0.6s cubic-bezier(.22, 1, .36, 1);
            transition:
                background 0.4s ease,
                box-shadow 0.4s ease,
                border-color 0.4s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(35px) scale(0.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .header {
            position: relative;
            background:
                linear-gradient(135deg, var(--header-1), var(--header-2));
            color: white;
            padding: 22px 25px;
            border-bottom: 1px solid rgba(255,255,255,0.16);
            overflow: hidden;
        }

        .header::before {
            content: "";
            position: absolute;
            width: 180px;
            height: 180px;
            right: -50px;
            top: -90px;
            background: rgba(255,255,255,0.13);
            border-radius: 50%;
            filter: blur(3px);
        }

        .header::after {
            content: "";
            position: absolute;
            width: 110px;
            height: 110px;
            left: 35%;
            bottom: -80px;
            background: rgba(255,255,255,0.08);
            border-radius: 50%;
        }

        .header-content {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 750;
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 13px;
            opacity: 0.9;
            margin-top: 5px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .theme-toggle {
            width: 43px;
            height: 43px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.14);
            color: white;

            cursor: pointer;
            box-shadow: none;
            backdrop-filter: blur(10px);

            font-size: 18px;
            transition:
                transform 0.25s ease,
                background 0.25s ease,
                box-shadow 0.25s ease;
        }

        .theme-toggle:hover {
            transform: rotate(15deg) scale(1.08);
            background: rgba(255,255,255,0.23);
            box-shadow: 0 8px 25px rgba(0,0,0,0.14);
        }

        .theme-toggle:active {
            transform: scale(0.95);
        }

        .theme-icon {
            display: inline-block;
            transition: transform 0.35s ease;
        }

        .theme-toggle.switching .theme-icon {
            transform: rotate(180deg) scale(0.8);
        }

        .status-badge {
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.28);
            background: rgba(255,255,255,0.14);
            backdrop-filter: blur(8px);
            white-space: nowrap;
        }

        .status-badge.online {
            color: #d9ffd9;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scroll-behavior: smooth;

            background: rgba(248, 250, 252, 0.35);
            transition: background 0.4s ease;
        }

        body.dark .chat-container {
            background: rgba(5, 8, 22, 0.18);
        }

        .chat-container::-webkit-scrollbar {
            width: 6px;
        }

        .chat-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: rgba(129, 140, 248, 0.55);
            border-radius: 10px;
        }

        .chat-container::-webkit-scrollbar-thumb:hover {
            background: rgba(129, 140, 248, 0.8);
        }

        .message {
            display: flex;
            gap: 10px;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: 72%;
            padding: 13px 17px;
            border-radius: 14px;
            word-wrap: break-word;
            white-space: pre-line;
            line-height: 1.55;
            font-size: 14px;
            transition:
                background 0.4s ease,
                color 0.4s ease,
                border-color 0.4s ease;
        }

        .message.user .message-bubble {
            background:
                linear-gradient(135deg, var(--header-1), var(--header-2));
            color: white;
            border-bottom-right-radius: 5px;
            box-shadow: 0 8px 22px rgba(99, 102, 241, 0.22);
        }

        .message.bot .message-bubble {
            background: var(--bubble-bot);
            color: var(--text);
            border: 1px solid var(--border);
            border-bottom-left-radius: 5px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
        }

        .message.bot .message-bubble.loading {
            background: var(--surface-soft);
        }

        .loading-dots {
            display: inline-flex;
            gap: 5px;
        }

        .loading-dots span {
            width: 6px;
            height: 6px;
            background: var(--accent);
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }

        .loading-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                opacity: 0.4;
                transform: translateY(0);
            }
            40% {
                opacity: 1;
                transform: translateY(-8px);
            }
        }

        .input-area {
            border-top: 1px solid var(--border);
            padding: 18px 20px;
            background: var(--surface);
            backdrop-filter: blur(15px);
            display: flex;
            gap: 12px;
            align-items: center;
            transition:
                background 0.4s ease,
                border-color 0.4s ease;
        }

        .input-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            background: var(--input-bg);
            border-radius: 26px;
            padding: 12px 18px;
            border: 1px solid transparent;
            transition: all 0.3s ease;
        }

        .input-wrapper:focus-within {
            background: var(--surface-solid);
            border-color: rgba(99, 102, 241, 0.5);
            box-shadow:
                0 0 0 4px rgba(99, 102, 241, 0.08),
                0 8px 24px rgba(99, 102, 241, 0.08);
        }

        input {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 14px;
            outline: none;
            color: var(--text);
        }

        input::placeholder {
            color: var(--text-soft);
        }

        button {
            padding: 12px 24px;
            background: linear-gradient(135deg, var(--header-1), var(--header-2));
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 650;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.22);
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 9px 25px rgba(99, 102, 241, 0.32);
        }

        button:active:not(:disabled) {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .welcome-message {
            text-align: center;
            color: var(--text-soft);
            font-size: 13px;
            padding: 12px;
            background: var(--welcome-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
        }

        .success-message {
            background: rgba(16, 185, 129, 0.1) !important;
            border-left: 4px solid #10b981 !important;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1) !important;
            border-left: 4px solid #ef4444 !important;
        }

        /* Theme transition overlay */
        .theme-overlay {
            position: fixed;
            inset: 0;
            z-index: 999;
            pointer-events: none;
            opacity: 0;
            background: radial-gradient(
                circle at var(--x, 50%) var(--y, 10%),
                rgba(129, 140, 248, 0.18),
                transparent 35%
            );
            transition: opacity 0.35s ease;
        }

        .theme-overlay.active {
            opacity: 1;
        }

        @media (max-width: 600px) {
            body {
                padding: 0;
            }

            .container {
                width: 100%;
                height: 100vh;
                max-height: 100vh;
                border-radius: 0;
            }

            .header {
                border-radius: 0;
            }

            .header-content {
                align-items: flex-start;
            }

            .header-actions {
                flex-direction: column;
            }

            .message-bubble {
                max-width: 90%;
            }

            .header h1 {
                font-size: 22px;
            }

            .status-badge {
                font-size: 11px;
                padding: 6px 10px;
            }

            .mouse-glow,
            .mouse-dot {
                display: none;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }

            .mouse-glow,
            .mouse-dot {
                display: none;
            }
        }
    </style>
</head>

<body>

    <div class="mouse-glow" id="mouseGlow"></div>
    <div class="mouse-dot" id="mouseDot"></div>
    <div class="theme-overlay" id="themeOverlay"></div>

    <div class="container">

        <div class="header">
            <div class="header-content">

                <div class="header-title">
                    <div>
                        <h1>🚨 SAIC</h1>
                        <p>Secure Autonomous Incident Commander</p>
                    </div>
                </div>

                <div class="header-actions">

                    <div class="status-badge online">
                        🟢 Online
                    </div>

                    <button
                        class="theme-toggle"
                        id="themeToggle"
                        aria-label="Toggle dark mode"
                        title="Toggle light/dark mode"
                    >
                        <span class="theme-icon" id="themeIcon">🌙</span>
                    </button>

                </div>

            </div>
        </div>

        <div class="chat-container" id="chatBox">
            <div class="welcome-message">
                👋 Welcome to SAIC! Report an incident and I'll help diagnose it in real-time.
            </div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <input
                    type="text"
                    id="messageInput"
                    placeholder="Describe your incident (e.g., 'Database timeout on payment service')"
                    onkeypress="if(event.key==='Enter') sendMessage()"
                >
            </div>

            <button onclick="sendMessage()" id="sendBtn">
                Send
            </button>
        </div>

    </div>

    <script>
        const API_URL = "https://saic-agent.onrender.com/api/v1/saic/chat";

        const chatBox = document.getElementById("chatBox");
        const messageInput = document.getElementById("messageInput");
        const sendBtn = document.getElementById("sendBtn");

        const themeToggle = document.getElementById("themeToggle");
        const themeIcon = document.getElementById("themeIcon");
        const themeOverlay = document.getElementById("themeOverlay");

        const mouseGlow = document.getElementById("mouseGlow");
        const mouseDot = document.getElementById("mouseDot");

        let sessionId = "session-" + Date.now();

        /* =========================
           THEME SYSTEM
        ========================= */

        function applyTheme(theme) {
            const isDark = theme === "dark";

            document.body.classList.toggle("dark", isDark);

            themeIcon.textContent = isDark ? "☀️" : "🌙";

            themeToggle.setAttribute(
                "aria-label",
                isDark ? "Switch to light mode" : "Switch to dark mode"
            );

            localStorage.setItem("saic-theme", theme);
        }

        function toggleTheme() {
            themeToggle.classList.add("switching");
            themeOverlay.style.setProperty("--x", "92%");
            themeOverlay.style.setProperty("--y", "8%");
            themeOverlay.classList.add("active");

            const nextTheme = document.body.classList.contains("dark")
                ? "light"
                : "dark";

            setTimeout(() => {
                applyTheme(nextTheme);
            }, 120);

            setTimeout(() => {
                themeToggle.classList.remove("switching");
                themeOverlay.classList.remove("active");
            }, 420);
        }

        const savedTheme = localStorage.getItem("saic-theme");

        if (savedTheme) {
            applyTheme(savedTheme);
        } else {
            applyTheme(
                window.matchMedia("(prefers-color-scheme: dark)").matches
                    ? "dark"
                    : "light"
            );
        }

        themeToggle.addEventListener("click", toggleTheme);

        /* =========================
           MOUSE ANIMATION
        ========================= */

        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;

        let glowX = mouseX;
        let glowY = mouseY;

        window.addEventListener("mousemove", (event) => {
            mouseX = event.clientX;
            mouseY = event.clientY;

            mouseDot.style.left = mouseX + "px";
            mouseDot.style.top = mouseY + "px";
        });

        function animateGlow() {
            glowX += (mouseX - glowX) * 0.08;
            glowY += (mouseY - glowY) * 0.08;

            mouseGlow.style.left = glowX + "px";
            mouseGlow.style.top = glowY + "px";

            requestAnimationFrame(animateGlow);
        }

        animateGlow();

        /* =========================
           CHAT FUNCTIONALITY
        ========================= */

        async function sendMessage() {
            const message = messageInput.value.trim();

            if (!message) return;

            addMessage(message, "user");

            messageInput.value = "";
            sendBtn.disabled = true;

            const loadingId = "loading-" + Date.now();

            addMessage(
                "Analyzing incident...",
                "bot",
                loadingId,
                true
            );

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: message,
                        session_id: sessionId,
                        user_id: "user",
                        environment: "simulation"
                    })
                });

                const text = await response.text();

                let data;

                try {
                    data = JSON.parse(text);
                } catch {
                    throw new Error("Invalid server response");
                }

                const loadingEl = document.getElementById(loadingId);

                if (loadingEl) {
                    loadingEl.remove();
                }

                if (response.ok) {

                    let answer;

                    try {
                        answer = JSON.parse(data.answer);
                    } catch {
                        answer = {
                            root_cause: "Unknown",
                            status: "Completed",
                            confidence: 0,
                            final_outcome: data.answer || "",
                            remediation_actions: []
                        };
                    }

                    const responseText = `
📊 Root Cause: ${answer.root_cause}
Status: ${answer.status}
Confidence: ${(answer.confidence * 100).toFixed(0)}%

${answer.final_outcome || ""}

${answer.remediation_actions
    ? "Actions:\n" + answer.remediation_actions.join("\n")
    : ""}
                    `.trim();

                    addMessage(
                        responseText,
                        "bot",
                        null,
                        false,
                        true
                    );

                } else {

                    addMessage(
                        "❌ Error: " +
                        (data.detail || "Unknown error"),
                        "bot",
                        null,
                        false,
                        false,
                        true
                    );
                }

            } catch (error) {

                const loadingEl = document.getElementById(loadingId);

                if (loadingEl) {
                    loadingEl.remove();
                }

                addMessage(
                    "❌ Connection error: " + error.message,
                    "bot",
                    null,
                    false,
                    false,
                    true
                );
            }

            sendBtn.disabled = false;
            messageInput.focus();
        }

        /* =========================
           MESSAGE RENDERING
        ========================= */

        function addMessage(
            text,
            type,
            elementId = null,
            isLoading = false,
            isSuccess = false,
            isError = false
        ) {

            const messageDiv = document.createElement("div");

            messageDiv.className =
                "message " + type;

            const bubbleDiv =
                document.createElement("div");

            bubbleDiv.className =
                "message-bubble" +
                (isLoading ? " loading" : "");

            if (isLoading) {

                bubbleDiv.innerHTML = `
                    ⏳ ${text}

                    <div
                        class="loading-dots"
                        style="margin-top: 8px;"
                    >
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                `;

            } else {

                bubbleDiv.textContent = text;
            }

            if (isSuccess) {
                bubbleDiv.classList.add("success-message");
            }

            if (isError) {
                bubbleDiv.classList.add("error-message");
            }

            messageDiv.appendChild(bubbleDiv);

            if (elementId) {
                messageDiv.id = elementId;
            }

            chatBox.appendChild(messageDiv);

            chatBox.scrollTop =
                chatBox.scrollHeight;
        }
    </script>

</body>
</html>
